name: "Tests"
on:
  pull_request:
  push:
    branches:
      - next-docker

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ShellCheck
        run: find . -type f \( -name "*.sh" -o -name ghost-docker \) -not -path "*/node_modules/*" -exec shellcheck {} +

  manager:
    name: Manager (format, lint, types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The released main layout the migration tests read (GD_RELEASED_MAIN).
      - run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "26"

      # The pnpm version pinned in package.json, through corepack, as the
      # image's own build does it.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

  # The release tooling the workflows run, a package of its own.
  scripts:
    name: Release scripts (types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "26"

      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The fixtures' git must not depend on a person's: signing is on here,
      # with nothing to sign with, and the tests still pass.
      - name: Sign every commit and tag, with nothing to sign with
        run: |
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true
          git config --global gpg.program false
      - run: pnpm test

  # The manager's code against the real daemon: joining a site's network,
  # the names that resolve on it, leaving it so the network can come down, and
  # the clients talking to the stack's MySQL and Caddy. Runs in a
  # container of the manager Dockerfile's `integration` stage.
  integration-linux:
    name: Manager integration on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/docker-hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Integration tests
        run: manager/test/integration/run.sh

  # The real thing on Linux, where file ownership is real: the image is built
  # from the checkout, started by the launcher, and what it writes into the
  # site directory has to belong to the runner's user.
  launcher-linux:
    name: Launcher and image on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/docker-hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Confirm the daemon answers as this user
        run: docker info --format '{{.ServerVersion}}' && docker compose version

      - name: Launcher end to end
        run: tests/e2e/launcher.sh

  # Real installations on Docker Engine: from the image alone and from a
  # clone, local and production, with the host's ports probed by the manager.
  # GitHub's macOS runners have no Docker daemon, so the macOS half of this
  # (OrbStack or Docker Desktop) is run by hand.
  install-linux:
    name: Install on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/docker-hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install end to end
        run: tests/e2e/install.sh

  # Real updates on Docker Engine: between three releases built from this
  # checkout (one that does not validate), and between two commits of a clone
  # (one whose Ghost never becomes healthy).
  self-update-linux:
    name: Self-update on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/docker-hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Self-update end to end
        run: tests/e2e/self-update.sh

  # An installation of the released main layout, migrated by the served
  # launcher: refusals before any change, recovery after a failed start, and
  # the migration keeping its project, data, routes and overrides.
  migrate-main-linux:
    name: Migration from the released main layout on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/docker-hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Migration end to end
        run: tests/e2e/migrate-main.sh

  # Real backups and restores on Docker Engine: a local site with ActivityPub
  # backed up, restored over itself and into a new directory, the lock
  # refusing a second operation, and a dump that fails.
  backup-linux:
    name: Backup and restore on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/docker-hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backup and restore end to end
        run: tests/e2e/backup.sh

  # Real Ghost-CLI sites, on SQLite and MySQL, exported with the released
  # exporter and imported through the launcher. Ghost-CLI runs on the host, so
  # this needs Node there too; the runner's own mysqldump serves the exporter.
  import-linux:
    name: Import on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/docker-hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - name: Import end to end
        run: tests/e2e/import.sh

  # A real Ghost-CLI production site (MySQL, systemd, nginx on port 80, an
  # admin domain) moved to Docker on the same server, as docs/install.md says:
  # a forced failure with nginx still running, its recovery, then the move.
  # It changes the host, which a runner is for.
  production-import-linux:
    name: Production import on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/docker-hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      # Ghost-CLI installed globally: its systemd service runs it as the
      # `ghost` user, which cannot reach npx's cache in the runner's home.
      - name: Ghost-CLI, nginx and MySQL for the source
        run: |
          npm install --global ghost-cli@1.33.4
          sudo apt-get update
          sudo apt-get install --yes nginx
          sudo systemctl start nginx mysql

      - name: Production import end to end
        env:
          GD_TEST_HOST_CHANGES: "1"
        run: tests/e2e/production-import.sh

  # macOS's system bash is 3.2, which the launcher has to run on. GitHub's
  # macOS runners have no Docker daemon, so the half of the test that runs the
  # real image is skipped, explicitly, here alone; the half that checks the
  # launcher's own behaviour against a stand-in docker runs in full. Every
  # other job fails rather than skip what it cannot run.
  launcher-macos:
    name: Launcher on macOS, bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Launcher against a stand-in docker
        env:
          GD_TEST_BASH: /bin/bash
          GD_E2E_ALLOW_SKIP: "1"
        run: |
          /bin/bash --version | head -1
          tests/e2e/launcher.sh

  # The one check branch protection requires: it passes only when every job
  # above succeeded or was skipped, so jobs can be added here without changing
  # the branch's settings.
  required-tests:
    name: All required tests passed or skipped
    needs:
      - shellcheck
      - manager
      - scripts
      - integration-linux
      - launcher-linux
      - install-linux
      - self-update-linux
      - migrate-main-linux
      - backup-linux
      - import-linux
      - launcher-macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Output needs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: echo "$NEEDS_JSON"
      - name: Check if any required jobs failed or were cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the dependent jobs has failed or been cancelled. You may need to re-run it." && exit 1
