name: "Served launcher"

# Serves the launcher at https://docker.ghost.org/install.sh: the release's own
# ghost-docker, with pages/index.html as the domain's front page, deployed to
# GitHub Pages from this workflow. There is no gh-pages branch: each deploy is
# the whole site, built from the release. The custom domain is set in the
# repository's Pages settings (a CNAME file is ignored for an Actions deploy).
# Only the newest release is served, and never by hand (plan §2.7). Then
# tests what is served, not the checkout's copy: it installs the newest beta,
# and an explicit --release.
#
# Called by the Release workflow. Run it by hand to deploy again, for
# example once the domain's DNS points at GitHub Pages. The github-pages
# environment must allow deployments from next-docker.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose launcher to serve
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: served-launcher
  cancel-in-progress: false

env:
  DOMAIN: docker.ghost.org
  TAG: ${{ inputs.tag }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "26"

      - name: Is it the newest release?
        id: newest
        run: |
          set -euo pipefail
          if node manager/scripts/release.ts moving "$TAG" | grep -qx beta; then
            echo "newest=true" >>"$GITHUB_OUTPUT"
          else
            echo "newest=false" >>"$GITHUB_OUTPUT"
            echo "::notice::$TAG is not the newest release, so the served launcher stays as it is"
          fi

      - name: The site
        if: steps.newest.outputs.newest == 'true'
        run: |
          set -euo pipefail
          site=$RUNNER_TEMP/site
          mkdir "$site"
          cp ghost-docker "$site/install.sh"
          sed "s/{{RELEASE}}/$TAG/g" pages/index.html >"$site/index.html"
          : >"$site/.nojekyll"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.newest.outputs.newest == 'true'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.newest == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Install with the served launcher
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - name: Wait until the release's launcher is served
        run: |
          set -euo pipefail
          want=$(sha256sum ghost-docker | cut -d' ' -f1)
          for attempt in $(seq 1 60); do
            # The query string goes around the CDN's cache.
            got=$(curl -fsSL "https://$DOMAIN/install.sh?run=$GITHUB_RUN_ID-$attempt" 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
            if [[ $got == "$want" ]]; then
              echo "https://$DOMAIN/install.sh is $TAG's launcher"
              exit 0
            fi
            sleep 15
          done
          echo "::error::https://$DOMAIN/install.sh did not become $TAG's launcher within 15 minutes. Check the repository's Pages settings (source: GitHub Actions, custom domain $DOMAIN) and that the domain's DNS points at GitHub Pages."
          exit 1

      - name: The front page is served
        run: |
          set -euo pipefail
          curl -fsSL "https://$DOMAIN/?run=$GITHUB_RUN_ID" | grep -q "release $TAG" ||
            { echo "::error::https://$DOMAIN/ is not $TAG's page"; exit 1; }

      - name: The served launcher installs the newest beta
        run: |
          set -euo pipefail
          site=$(mktemp -d)
          curl -fsSL "https://$DOMAIN/install.sh" | bash -s -- --dir "$site" install --local --no-prompt
          version=$(jq -r .stack.version "$site/.ghost-docker.json")
          channel=$(jq -r .channel "$site/.ghost-docker.json")
          [[ $version == "$TAG" && $channel == beta ]] || {
            echo "::error::installed $version on $channel, expected $TAG on beta"
            exit 1
          }
          "$site/ghost-docker" check
          docker compose --project-directory "$site" -f "$site/compose.yml" down --volumes

      - name: The served launcher installs an explicit --release
        run: |
          set -euo pipefail
          site=$(mktemp -d)
          curl -fsSL "https://$DOMAIN/install.sh" | bash -s -- --dir "$site" install --local --no-prompt --no-start --release "$TAG"
          version=$(jq -r .stack.version "$site/.ghost-docker.json")
          [[ $version == "$TAG" ]] || {
            echo "::error::installed $version, expected $TAG"
            exit 1
          }
          grep -q "^readonly GD_PINNED_IMAGE=\"ghcr.io/tryghost/ghost-docker@sha256:" "$site/ghost-docker"
